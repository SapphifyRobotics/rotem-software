name: Software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python3 tools/check_public.py
      - run: cc -Wall -Werror -Ifirmware/app tests/trial_vectors.c -lm -o /tmp/vectors && /tmp/vectors
      - run: cc -Wall -Werror -Ifirmware/app tests/recovery.c -o /tmp/recovery && /tmp/recovery
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: studio
